# Template & Configuration schemas

Template:
  type: object
  required:
    - id
    - name
    - description
    - pdf_path
    - fields
  properties:
    id:
      type: integer
    name:
      type: string
    description:
      type: string
      description: Free-text description, also passed to the LLM as context when filling
    pdf_path:
      type: string
      description: Project-relative path of the template PDF
      example: "data/inputs/ics_209.pdf"
    fields:
      $ref: "#/TemplateFields"
    field_count:
      type: integer
      nullable: true
      description: Number of fields in `fields`, or of fillable widgets in the PDF
        when `fields` is empty. Null if the PDF could not be read.

TemplateFields:
  type: object
  description: |
    The template's field dictionary. Either a flat map of field name to field
    type (e.g. `{"incident_name": "string"}`), or, when extracted from the PDF,
    `{"schema": <JSON Schema>, "tables": [...], "groups": [...]}`. Empty when
    nothing has been defined or extracted.
  additionalProperties: true

CreateTemplateRequest:
  type: object
  required:
    - name
    - pdf_path
  properties:
    name:
      type: string
    description:
      type: string
      default: ""
    pdf_path:
      type: string
      description: Project-relative path of a PDF already stored in the project,
        usually the `pdf_path` returned by POST /api/v1/templates/upload
    fields:
      allOf:
        - $ref: "#/TemplateFields"
      default: {}
      description: Field dictionary. Leave empty to extract it from the PDF.

UpdateTemplateRequest:
  type: object
  description: Only the keys sent are changed.
  properties:
    name:
      type: string
      nullable: true
    description:
      type: string
      nullable: true
    fields:
      allOf:
        - $ref: "#/TemplateFields"
      nullable: true

ExtractedField:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      description: Field name; table columns are named `<table>.<column>`
    description:
      type: string
      default: ""
    type:
      type: string
      default: "string"

TemplateUploadResponse:
  type: object
  required:
    - filename
    - pdf_path
  properties:
    filename:
      type: string
      description: Name the PDF was stored under (a timestamp is added on a name clash)
    pdf_path:
      type: string
      description: Project-relative path to send to POST /api/v1/templates/create
    field_count:
      type: integer
      nullable: true
      description: Number of fields found. Null if the PDF could not be read.
    fields:
      type: array
      items:
        $ref: "#/ExtractedField"
    schema_data:
      type: object
      nullable: true
      additionalProperties: true
      description: JSON Schema extracted from the PDF, when extraction succeeded
    tables:
      type: array
      nullable: true
      items:
        type: object
        additionalProperties: true
      description: Tables detected in the PDF, when extraction succeeded

MakeFillableRequest:
  type: object
  required:
    - pdf_path
  properties:
    pdf_path:
      type: string
      description: Project-relative path of the stored PDF to make fillable

MakeFillableResponse:
  type: object
  required:
    - pdf_path
  properties:
    pdf_path:
      type: string
      description: Project-relative path of the new fillable copy
    field_count:
      type: integer
      nullable: true
      description: Number of fillable widgets in the new copy
