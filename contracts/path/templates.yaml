# Layer 6 Template & Configuration Endpoints
# GET    /api/v1/templates
# POST   /api/v1/templates/upload
# GET    /api/v1/templates/preview
# POST   /api/v1/templates/create
# POST   /api/v1/templates/make-fillable
# PUT    /api/v1/templates/{template_id}
# DELETE /api/v1/templates/{template_id}

templates:
  get:
    operationId: listTemplates
    summary: List all registered form templates
    description: |
      Returns every registered template, newest first. `field_count` is worked
      out from the stored field dictionary, or by counting the PDF's fillable
      widgets when the template has no fields stored.
    tags:
      - templates
    responses:
      "200":
        description: List of all templates
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../schemas/template.yaml#/Template"
            example:
              - id: 2
                name: "Manual Test Template"
                description: "Employee contact and sign-off form used to manually verify that FireForm fills a PDF correctly."
                pdf_path: "data/inputs/file_template_manual.pdf"
                fields:
                  "Employee's name": "string"
                  "Employee's job title": "string"
                  "Date": "string"
                field_count: 3

templates_upload:
  post:
    operationId: uploadTemplatePdf
    summary: Upload a blank PDF to build a template from
    description: |
      Stores a blank agency PDF in the project and extracts its fillable
      fields, so the editor can show them before the template is registered.
      This is the first step of the template-authoring flow: the returned
      `pdf_path` is then sent to `POST /api/v1/templates/create` (optionally
      after `POST /api/v1/templates/make-fillable` for a flat PDF).

      If a file with the same name already exists in `directory`, a timestamp
      is added to the new file's name instead of overwriting it.
    tags:
      - templates
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: Blank fillable or flat PDF form. Must end in `.pdf`. Max 10 MB.
              directory:
                type: string
                default: "data/inputs"
                description: Project-relative directory to store the PDF in
                  (defaults to FIREFORM_TEMPLATE_DIR). Must be inside the project.
    responses:
      "200":
        description: PDF stored and its fields extracted
        content:
          application/json:
            schema:
              $ref: "../schemas/template.yaml#/TemplateUploadResponse"
            example:
              filename: "ics_209.pdf"
              pdf_path: "data/inputs/ics_209.pdf"
              field_count: 2
              fields:
                - name: "incident_name"
                  description: "Incident name"
                  type: "string"
                - name: "incident_number"
                  description: "Incident number"
                  type: "string"
              schema_data: null
              tables: null
      "400":
        description: Missing filename, not a `.pdf` file, or `directory` outside the project
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/HTTPErrorDetail"
            example:
              detail: "Only PDF files are supported."
      "413":
        description: PDF exceeds the 10 MB limit
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            example:
              error_code: "FILE_TOO_LARGE"
              message: "PDF template exceeds maximum size of 10MB"
              detail:
                max_size_bytes: 10485760
                received_size_bytes: 12582912

templates_preview:
  get:
    operationId: previewTemplatePdf
    summary: Stream a stored PDF for preview
    description: |
      Returns a PDF stored in the project (a template or a filled output) with
      `Content-Disposition: inline`, so the frontend can show it in its viewer.
    tags:
      - templates
    parameters:
      - name: path
        in: query
        required: true
        description: Project-relative PDF path, as returned in `pdf_path` or
          `output_pdf_path`. Must be inside the project.
        schema:
          type: string
          example: "data/inputs/ics_209.pdf"
    responses:
      "200":
        description: The PDF file
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      "400":
        description: Path is empty, outside the project, or not a `.pdf` file
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/HTTPErrorDetail"
            example:
              detail: "Only PDF files can be previewed."
      "404":
        description: No file at that path
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/HTTPErrorDetail"
            example:
              detail: "PDF file not found."

templates_create:
  post:
    operationId: createTemplate
    summary: Register a new form template
    description: |
      Registers a template for a PDF already stored in the project (see
      `POST /api/v1/templates/upload`). When `fields` is empty, the field
      dictionary is extracted from the PDF itself.
    tags:
      - templates
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/template.yaml#/CreateTemplateRequest"
          example:
            name: "ICS 209 Incident Status Summary"
            description: "Incident status summary sent to the coordination center."
            pdf_path: "data/inputs/ics_209.pdf"
            fields: {}
    responses:
      "200":
        description: Template created
        content:
          application/json:
            schema:
              $ref: "../schemas/template.yaml#/Template"
      "400":
        description: "`pdf_path` is empty or outside the project"
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/HTTPErrorDetail"
      "422":
        description: Request body failed validation
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"

templates_make_fillable:
  post:
    operationId: makeTemplateFillable
    summary: Detect form fields in a flat PDF and save a fillable copy
    description: |
      Runs field detection (commonforms) on a stored PDF and writes a fillable
      copy next to it as `<name>_template.pdf`. The returned `pdf_path` can be
      sent to `POST /api/v1/templates/create`. This can take a minute on CPU.
    tags:
      - templates
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/template.yaml#/MakeFillableRequest"
          example:
            pdf_path: "data/inputs/ics_209.pdf"
    responses:
      "200":
        description: Fillable copy created
        content:
          application/json:
            schema:
              $ref: "../schemas/template.yaml#/MakeFillableResponse"
            example:
              pdf_path: "data/inputs/ics_209_template.pdf"
              field_count: 48
      "400":
        description: "`pdf_path` is empty or outside the project"
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/HTTPErrorDetail"
      "404":
        description: No file at `pdf_path`
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/HTTPErrorDetail"
            example:
              detail: "PDF file not found."
      "500":
        description: Field detection failed
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            example:
              error_code: "MAKE_FILLABLE_FAILED"
              message: "Could not make the PDF fillable: RuntimeError"

template_by_id:
  put:
    operationId: updateTemplate
    summary: Update a template's name, description or fields
    description: |
      Partial update: only the keys sent are changed. `pdf_path` cannot be
      changed; register a new template for a different PDF.
    tags:
      - templates
    parameters:
      - name: template_id
        in: path
        required: true
        description: Unique identifier of the template to update
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../schemas/template.yaml#/UpdateTemplateRequest"
          example:
            description: "Updated ICS 209 description used as extra context when filling"
    responses:
      "200":
        description: Template updated
        content:
          application/json:
            schema:
              $ref: "../schemas/template.yaml#/Template"
      "404":
        description: Template not found
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/HTTPErrorDetail"
            example:
              detail: "Template not found"

  delete:
    operationId: deleteTemplate
    summary: Delete a template and everything filled from it
    description: |
      Deletes the template, its form submissions and their output PDFs, and
      its jobs. The template's PDF is deleted too, unless another template
      still uses the same file or it is the bundled seed PDF.

      Requires the API key when `FIREFORM_API_KEY` is set.
    tags:
      - templates
    security:
      - ApiKeyHeader: []
      - BearerAuth: []
    parameters:
      - name: template_id
        in: path
        required: true
        description: Unique identifier of the template to delete
        schema:
          type: integer
    responses:
      "200":
        description: Template deleted
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/StatusMessage"
            example:
              status: "success"
              message: "Template and all associated data deleted"
      "401":
        description: Missing or wrong API key
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/ErrorResponse"
            example:
              error_code: "UNAUTHORIZED"
              message: "Unauthorized"
      "404":
        description: Template not found
        content:
          application/json:
            schema:
              $ref: "../schemas/common.yaml#/HTTPErrorDetail"
            example:
              detail: "Template not found"
